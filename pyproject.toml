[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-analysis"
version = "0.1.0"
description = "SKALA Day2: Adult Census 소득 데이터 End2End 분석 파이프라인"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "polars.*",
    "seaborn.*",
    "matplotlib.*",
    "plotly.*",
    "sklearn.*",
    "scipy.*",
    "joblib.*",
    "schedule.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=e2e --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
