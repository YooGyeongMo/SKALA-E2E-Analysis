name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e .
      - name: Ruff check
        run: python -m ruff check src tests scripts
      - name: Ruff format check
        run: python -m ruff format --check src tests scripts
      - name: Mypy
        run: python -m mypy src
      - name: Pytest with coverage gate
        run: python -m pytest

  quality-check:
    # 브랜치 보호가 참조하는 단일 집계 잡: 매트릭스 전체가 통과해야 성공
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "매트릭스 중 실패가 있습니다: ${{ needs.quality.result }}"
            exit 1
          fi
          echo "전체 매트릭스 통과"

  pr-report:
    needs: quality
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment result on PR
        uses: actions/github-script@v7
        with:
          script: |
            const result = "${{ needs.quality.result }}";
            const ok = result === "success";
            const marker = "<!-- ci-report -->";
            const body = [
              marker,
              `## CI 결과: ${ok ? "통과" : "실패"}`,
              "",
              `- 매트릭스: ubuntu / macos / windows x Python 3.11 / 3.13`,
              `- 검사: ruff check, ruff format, mypy, pytest(커버리지 80% 게이트)`,
              `- 종합: ${ok ? "전체 통과" : `실패 (${result}) - 세부는 Checks 탭 확인`}`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
